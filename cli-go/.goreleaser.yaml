version: 2
project_name: bing-webmaster-cli
builds:
  - binary: bwt
    dir: cli-go
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/piyush-gambhir/bing-webmaster-cli/cli-go/internal/build.Version={{.Version}}
      - -X github.com/piyush-gambhir/bing-webmaster-cli/cli-go/internal/build.Commit={{.Commit}}
      - -X github.com/piyush-gambhir/bing-webmaster-cli/cli-go/internal/build.Date={{.Date}}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md
sboms:
  - artifacts: archive
checksum:
  name_template: checksums.txt
release:
  # The release workflow publishes the draft after attesting the artifacts, so
  # the release is complete when it becomes visible (and immutable).
  name_template: "Bing Webmaster CLI {{ .Tag }}"
  draft: true
  replace_existing_draft: true
  # Versions with a suffix (v1.0.0-rc.1) are published as pre-releases.
  prerelease: auto
changelog:
  sort: asc
  filters:
    exclude: ['^docs:', '^test:', '^ci:', '^chore:']
